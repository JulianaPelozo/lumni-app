{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-5">
        <div class="card lunar-card mb-4">
            <div class="card-body">
                <h4>Registro de hoje 🌙</h4>
                <form id="dailyForm">
                    <label>Humor (1=muito ruim, 5=excelente)</label>
                    <input type="number" id="mood" min="1" max="5" class="form-control mb-2" required>
                    <label>Energia (1=exausto, 5=cheio)</label>
                    <input type="number" id="energy" min="1" max="5" class="form-control mb-2" required>
                    <label>Horas de sono</label>
                    <input type="number" step="0.5" id="sleep" class="form-control mb-2" required>
                    <label>Tarefas concluídas</label>
                    <input type="number" id="tasks" class="form-control mb-3" required>
                    <button type="submit" class="btn btn-primary w-100">Salvar hoje</button>
                </form>
            </div>
        </div>
        <div class="card lunar-card">
            <div class="card-body">
                <h4>Alertas & Insights</h4>
                <div id="alertsList" class="small">Carregando...</div>
            </div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card lunar-card">
            <div class="card-body">
                <canvas id="moodChart" width="400" height="200"></canvas>
                <hr>
                <canvas id="sleepEnergyChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}
