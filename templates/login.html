{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card lunar-card">
            <div class="card-body">
                <h3 class="card-title text-center">🌙 Entrar</h3>
                <form id="loginForm">
                    <div class="mb-3">
                        <label>Usuário</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Senha</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <p class="mt-3 text-center">Ainda não tem conta? <a href="/register">Registre-se</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
